[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-eink-dashboard"
version = "0.1.0"
description = "Local Codex task and quota dashboard for SKD-CLOCK e-ink displays"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "bleak>=0.22",
  "watchdog>=4.0",
]

[project.scripts]
codex-eink = "codex_eink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
